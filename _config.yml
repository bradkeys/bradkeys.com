# Permalinks
#
# Use of `relative_permalinks` ensures post links from the index work properly.
permalink:           pretty
relative_permalinks: false

exclude:
   - script

plugins:
   - jekyll-paginate

# Setup
title: Brad Keys
url: https://bradkeys.com
# Thumbnail and social preview image for posts and pages that have none of their own.
# Its book icon is Font Awesome Free (CC BY 4.0, https://fontawesome.com/license/free).
default_image: /img/default-thumbnail.jpg
description: Game developer and designer with 15+ years of Unity experience. Game dev blog and portfolio of Brad Keys.
highlighter: rouge
paginate: 999  # I am not actively blogging enough to need this
sass:
  style: compressed
  sourcemap: never
