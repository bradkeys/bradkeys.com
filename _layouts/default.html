<!DOCTYPE html>
<html lang="en">
    {% include head.html %}
    <body>
        <a class="skip-link" href="#main-content">Skip to content</a>
        {% assign path = page.url %}
        <div id="header-wrapper">
            <div id="header">
                <div id="logo">
                    <a href="/">
                        <span id="logo-title">Brad Keys</span>
                        <span id="logo-subtitle">Game Designer | Programmer</span>
                    </a>
                </div>
                <nav aria-label="Main">
                    <div id="nav-links">
                        <a class="nav-link" href="/"{% if path == '/' or page.layout == 'portfolio' %} aria-current="page"{% endif %}>Portfolio</a>
                        <a class="nav-link" href="/blog/"{% if path contains '/blog/' or page.layout == 'post' %} aria-current="page"{% endif %}>Blog</a>
                        <a class="nav-link" href="/contact/"{% if path == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
                    </div>
                    <div id="social-links">
                        <a class="social-icon hvr-grow" href="https://www.linkedin.com/in/bradkeys" aria-label="LinkedIn profile" title="LinkedIn Profile">{% include icons/linkedin-in.svg %}</a>
                        <a class="social-icon hvr-grow" href="https://github.com/bradkeys" aria-label="GitHub profile" title="GitHub Profile">{% include icons/github.svg %}</a>
                    </div>
                </nav>
            </div>
        </div>
        <div id="main-wrapper">
            <main id="main-content" tabindex="-1">
                {{ content }}
            </main>
        </div>
    </body>
</html>
