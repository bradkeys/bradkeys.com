---
layout: default
---

<div id="blog-post">
    <article>
        <div id="article-header">
            <h1>{{ page.title }}</h1>
            <time datetime="{{ page.date | date: "%Y/%m/%d" }}">{{ page.date  | date_to_string }}</time>
        </div>
        <div class="content">
            {{ content }}
        </div>
    </article>
</div>
