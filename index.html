---
layout: blog
title: Game Dev Blog
---

<!-- This loops through the paginated posts -->
{% for post in paginator.posts %}
    <article>
        <div class="row">
            <div class="col-md-3">
                <time datetime="{{ post.date | date: "%Y-%m-%d" }}">{{ post.date  | date_to_string }}</time>
                {% assign thumb = post.image | default: site.default_image %}
                <a class="hvr-grow" href="{{ post.url }}" tabindex="-1" aria-hidden="true">
                    <img src="{{ thumb }}" alt="{% if post.image %}{{ post.title | escape }}{% endif %}" {% include img-size.html src=thumb %} loading="lazy" decoding="async" />
                </a>
            </div>
            <div class="col-md-9">
                <h1>
                    <a href="{{ post.url }}">{{ post.title }}</a>
                </h1>
                <div class="excerpt">
                    <p>{{ post.content | strip_html | truncatewords:75 }}</p>
                    <a class="btn btn-sharp btn-sm hvr-push" href="{{ post.url }}">Read More<span class="visually-hidden"> about {{ post.title | escape }}</span></a>
                </div>
            </div>
        </div>
    </article>
{% endfor %}
