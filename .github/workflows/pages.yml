name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v6
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # Internal links, image references and alt text. The WebGL builds are
      # Unity exports we don't control, so they're skipped.
      - run: >
          bundle exec htmlproofer ./_site
          --disable-external --no-enforce-https
          --ignore-files "/\/(ggj2021|ggj2022|ggj2024|tojam2024)\//"
        env:
          LANG: C.UTF-8
      # Every post needs one valid BlogPosting and the home page a valid Person;
      # see script/check-structured-data.
      - run: bundle exec ruby script/check-structured-data _site
      # W3C Nu HTML Checker (errors only). Java is preinstalled on the runner.
      - name: Validate HTML
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/vnu" vnu-jar@26.10.12
          find _site -name '*.html' \
            -not -path '*/ggj2021/*' -not -path '*/ggj2022/*' \
            -not -path '*/ggj2024/*' -not -path '*/tojam2024/*' -print0 \
            | xargs -0 java -jar "$RUNNER_TEMP/vnu/node_modules/vnu-jar/build/dist/vnu.jar" --errors-only
      - uses: actions/upload-pages-artifact@v5

  # Guards the performance, accessibility and SEO scores (see lighthouserc.json).
  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - run: npx --yes @lhci/cli@0.14 autorun

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
